spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
printdesk.storage.root=${PRINTDESK_STORAGE_ROOT:${user.home}/.printdesk/storage}
printdesk.storage.max-file-size=25MB
printdesk.documents.libre-office-command=${LIBREOFFICE_COMMAND:soffice}
printdesk.documents.docx-conversion-timeout-seconds=30
printdesk.documents.max-image-pixels=25000000
printdesk.documents.max-docx-expanded-bytes=104857600
printdesk.documents.max-docx-entries=10000
printdesk.security.jwt.secret=${PRINTDESK_JWT_SECRET:}
printdesk.security.jwt.issuer=${PRINTDESK_JWT_ISSUER:https://printdesk.local}
printdesk.admin.bootstrap.username=${PRINTDESK_ADMIN_BOOTSTRAP_USERNAME:}
printdesk.admin.bootstrap.password=${PRINTDESK_ADMIN_BOOTSTRAP_PASSWORD:}

spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
